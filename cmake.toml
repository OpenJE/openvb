[cmake]
version = "3.24"
cmkr-include = "cmkr.cmake"

[project]
name = "openvb"
languages = ["CXX"]

[variables]
CMAKE_RUNTIME_OUTPUT_DIRECTORY = "${CMAKE_SOURCE_DIR}/build"
CMAKE_ARCHIVE_OUTPUT_DIRECTORY = "${CMAKE_SOURCE_DIR}/obj"
CMAKE_LIBRARY_OUTPUT_DIRECTORY = "${CMAKE_SOURCE_DIR}/obj"
CMAKE_TRY_COMPILE_TARGET_TYPE = "STATIC_LIBRARY"

[options]
OPENVB_TRACING = false

[target.openje]
type = "static"
sources = [
    "modules/openje/src/JE.cpp",
    "modules/openje/src/JE/Action.cpp",
    "modules/openje/src/JE/ActionAnim.cpp",
    "modules/openje/src/JE/AnimationCache.cpp",
    "modules/openje/src/JE/CameraControl.cpp",
    "modules/openje/src/JE/Client.cpp",
    "modules/openje/src/JE/DialogueManager.cpp",
    "modules/openje/src/JE/Gregorian.cpp",
    "modules/openje/src/JE/ModelCache.cpp",
    "modules/openje/src/JE/PathManager.cpp",
    "modules/openje/src/JE/cls_0x4d8d70.cpp",
    "modules/openje/src/JE/cls_0x50db20.cpp",
    "modules/openje/src/JE/Common/Chunk.cpp",
    "modules/openje/src/JE/MemorySystem.cpp",
    "modules/openje/src/JE/Network.cpp",
    "modules/openje/src/JE/Resources.cpp",
    "modules/openje/src/JE/ResourceSystem.cpp",
    "modules/openje/src/JE/Scripting.cpp",
    "modules/openje/src/JE/SpatialGrid.cpp",
    "modules/openje/src/JE/Strings.cpp",
    "modules/openje/src/JE/VFX_Parameter.cpp",
    "modules/openje/src/JE/World.cpp",
    "modules/openje/src/JE/Map.cpp",
    "modules/openje/src/JE/SS/StringSystem.cpp",
    "modules/openje/src/JE/SS/EngineStringSystem.cpp",
    "modules/openje/src/JE/SS/StringFormat.cpp",
    "modules/openje/src/JE/Subsystem.cpp",
]
private-include-directories = ["src", "modules/openje/src", "modules/tracing/src"]
msvc.private-compile-options = ["/EHsc", "/wd4234"]

[target.tracing]
type = "static"
sources = ["modules/tracing/src/tracing.cpp"]
private-include-directories = ["src", "modules/openje/src", "modules/tracing/src"]
msvc.private-compile-options = ["/EHsc", "/wd4234"]

[target.F3]
type = "executable"
sources = ["src/main.cpp", "src/F3.cpp", "src/F3/GameWorld.cpp", "src/F3/GameAnimationCache.cpp", "src/F3/GamePathManager.cpp", "src/F3/GameNetwork.cpp", "src/F3/RenderD3D8.cpp", "src/F3/ScriptNatives.cpp", "src/F3/Commands.cpp", "src/F3/CommandRegistry.cpp", "src/F3/GameClient.cpp", "src/F3/MapEntitySpawn.cpp", "src/F3/CombatManager.cpp", "src/F3/GameActionAttack.cpp", "src/F3/CombatMath.cpp"]   # Commands.cpp: R-USERRE-A slice 1; CommandRegistry.cpp: slice-5b registry TU split verbatim from F3.cpp (hand-verified against CMakeLists.txt - cmkr guard INACTIVE per item 62); MapEntitySpawn/CombatManager: cmake-drift link sync authorized by coordinator (12-unresolved census mapped TU-by-TU, ruling a)
private-include-directories = ["src", "modules/openje/src", "modules/tracing/src"]
private-link-libraries = ["openje", "tracing"]
windows.private-link-libraries = ["user32", "gdi32", "winmm", "shell32", "d3d8"]   # M-001 slice 1: d3d8 links via the SDK prerelease dirs appended by msvc-sdk-prerelease.bat (bbf7346); smoke-proven compile+link 2026-10-21
msvc.private-compile-options = ["/EHsc"]
cmake-after = """
if(NOT MSVC)
    foreach(target_name openje tracing F3)
        target_compile_options(${target_name} PRIVATE -std=c++98)
    endforeach()
endif()

if(OPENVB_TRACING)
    set_target_properties(openje PROPERTIES OUTPUT_NAME "openje-trace")
    set_target_properties(tracing PROPERTIES OUTPUT_NAME "tracing-trace")
    set_target_properties(F3 PROPERTIES OUTPUT_NAME "F3-trace")
endif()

foreach(target_name openje tracing F3)
    target_compile_definitions(${target_name} PRIVATE
        $<$<OR:$<CONFIG:Debug>,$<BOOL:${OPENVB_TRACING}>>:TRACING TRACE_TERMINAL TRACE_FILE>
    )
endforeach()

if(MSVC)
    foreach(target_name openje tracing F3)
        target_compile_options(${target_name} PRIVATE
            $<$<CONFIG:Debug>:/Zi /Od /GS>
            $<$<CONFIG:Release>:/O2>
        )
    endforeach()
endif()
"""

[target.F3.properties]
WIN32_EXECUTABLE = true
OUTPUT_NAME = "F3"
DEBUG_POSTFIX = "-dbg"
