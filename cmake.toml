[target.tracing]
type = "static"
sources = ["modules/tracing/src/tracing.cpp"]
private-include-directories = ["src", "modules/openje/src", "modules/tracing/src"]
msvc.private-compile-options = ["/EHsc", "/wd4234"]

[target.F3]
type = "executable"
sources = [
    "src/HostHooks.cpp",
    "src/F3.cpp",
    "src/F3/CombatManager.cpp",
    "src/F3/CombatMath.cpp",
    "src/F3/CommandRegistry.cpp",
    "src/F3/Commands.cpp",
    "src/F3/GameActionAttack.cpp",
    "src/F3/GameAnimationCache.cpp",
    "src/F3/GameClient.cpp",
    "src/F3/GameNetwork.cpp",
    "src/F3/GamePathManager.cpp",
    "src/F3/GameWeapon.cpp",
    "src/F3/GameWorld.cpp",
    "src/F3/MapEntitySpawn.cpp",
    "src/F3/RenderD3D8.cpp",
    "src/F3/ScriptNatives.cpp",
    "src/F3/StartupMovies.cpp",
    "src/main.cpp"
]   # Commands.cpp: R-USERRE-A slice 1; CommandRegistry.cpp: slice-5b registry TU split verbatim from F3.cpp (hand-verified against CMakeLists.txt - cmkr guard INACTIVE per item 62); MapEntitySpawn/CombatManager: cmake-drift link sync authorized by coordinator (12-unresolved census mapped TU-by-TU, ruling a)
private-include-directories = ["src", "modules/openje/src", "modules/tracing/src"]
private-link-libraries = ["openje", "tracing"]
windows.private-link-libraries = ["user32", "gdi32", "winmm", "shell32", "ws2_32", "dsound", "d3d8", "ole32"]   # P2 slice-1: dsound added for CSoundSystem::meth_0x52a2e0 (DirectSoundCreate8)   # M-001 slice 1: d3d8 links via the SDK prerelease dirs appended by msvc-sdk-prerelease.bat (bbf7346); smoke-proven compile+link 2026-10-21
msvc.private-compile-options = ["/EHsc"]
cmake-after = """
# M-MOVIES: binkw32 import library, generated by devenv/scripts/msvc-build.nix from src/F3/binkw32.def
# (lib /def:) before cmake runs. There is no vendored .lib - the RadTools drop ships headers and DLLs, not
# MSVC import libs for this compiler - and LoadLibrary would make the port's linkage visibly different from
# the original, which statically imports nine Bink functions. Linked by explicit path so no search directory
# has to be agreed between the two build files. Lives in cmake-after rather than the target's
# private-link-libraries because it is a file path, not a library name, and cmkr would rewrite the latter.
if(MSVC)
    # Unconditional on purpose: an earlier version gated on if(EXISTS ...binkw32.lib), which turned a
    # missing/late-generated import library into a SUCCESSFUL link of an exe that could never play movies -
    # the silent-degradation shape this project keeps paying for. If the def step did not run, link fails.
    target_link_libraries(F3 PRIVATE "${CMAKE_BINARY_DIR}/binkw32.lib")
endif()

if(NOT MSVC)
    foreach(target_name openje tracing F3)
        target_compile_options(${target_name} PRIVATE -std=c++98)
    endforeach()
endif()

if(OPENVB_TRACING)
    set_target_properties(openje PROPERTIES OUTPUT_NAME "openje-trace")
    set_target_properties(tracing PROPERTIES OUTPUT_NAME "tracing-trace")
    set_target_properties(F3 PROPERTIES OUTPUT_NAME "F3-trace")
endif()

foreach(target_name openje tracing F3)
    target_compile_definitions(${target_name} PRIVATE
        $<$<OR:$<CONFIG:Debug>,$<BOOL:${OPENVB_TRACING}>>:TRACING TRACE_TERMINAL TRACE_FILE>
    )
endforeach()

if(MSVC)
    foreach(target_name openje tracing F3)
        target_compile_options(${target_name} PRIVATE
            $<$<CONFIG:Debug>:/Zi /Od /GS>
            $<$<CONFIG:Release>:/O2>
        )
    endforeach()
endif()
"""

[target.F3.properties]
WIN32_EXECUTABLE = true
OUTPUT_NAME = "F3"
DEBUG_POSTFIX = "-dbg"
